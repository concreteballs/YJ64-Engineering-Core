[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yj64-engineering-core"
version = "0.1.0"
description = "Modular engineering interfaces and reference calculations for YJ64"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - project owner controlled" }
authors = [{ name = "YJ64 Engineering Core contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
