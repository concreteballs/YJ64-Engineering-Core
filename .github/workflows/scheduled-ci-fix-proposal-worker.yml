name: Scheduled CI Fix Proposal Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Scheduled CI Log Analysis Worker"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: yj64-ci-fix-proposals
  cancel-in-progress: false

jobs:
  prepare-one:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YJ64 package and PostgreSQL driver
        run: python -m pip install -e .
      - name: Prepare one review-gated CI repair proposal
        env:
          YJ64_DATABASE_URL: ${{ secrets.YJ64_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/run_ci_fix_proposal_worker.py
