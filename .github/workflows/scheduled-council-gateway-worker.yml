name: Scheduled YJ64 Council Gateway Worker

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/scheduled-council-gateway-worker.yml"
      - "scripts/run_council_gateway_worker.py"
      - "src/yj64_engineering_core/automation/council_gateway.py"
      - "src/yj64_engineering_core/automation/council_tasks.py"
      - "src/yj64_engineering_core/automation/browser_agent_bridge.py"
      - "src/yj64_engineering_core/automation/postgres_store.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yj64-council-gateway-worker
  cancel-in-progress: false

jobs:
  process-one:
    name: Process one council task (worker ${{ matrix.slot }})
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: ["1", "2", "3"]
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YJ64 package and PostgreSQL driver
        run: python -m pip install -e .
      - name: Check Council Gateway secrets
        id: config
        env:
          YJ64_DATABASE_URL: ${{ secrets.YJ64_DATABASE_URL }}
          YJ64_COUNCIL_API_URL: ${{ secrets.YJ64_COUNCIL_API_URL || 'https://ggambesixwejgbjwtnhw.supabase.co/functions/v1/council-api' }}
          YJ64_COUNCIL_AGENT_TOKEN: ${{ secrets.YJ64_COUNCIL_AGENT_TOKEN }}
          YJ64_COUNCIL_API_PUBLISHABLE_KEY: ${{ secrets.YJ64_COUNCIL_API_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$YJ64_DATABASE_URL" ] || [ -z "$YJ64_COUNCIL_API_URL" ] || [ -z "$YJ64_COUNCIL_AGENT_TOKEN" ] || [ -z "$YJ64_COUNCIL_API_PUBLISHABLE_KEY" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Council Gateway secrets are not configured; worker skipped."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Process one Council Gateway task
        if: steps.config.outputs.enabled == 'true'
        env:
          YJ64_DATABASE_URL: ${{ secrets.YJ64_DATABASE_URL }}
          YJ64_COUNCIL_API_URL: ${{ secrets.YJ64_COUNCIL_API_URL || 'https://ggambesixwejgbjwtnhw.supabase.co/functions/v1/council-api' }}
          YJ64_COUNCIL_AGENT_TOKEN: ${{ secrets.YJ64_COUNCIL_AGENT_TOKEN }}
          YJ64_COUNCIL_API_PUBLISHABLE_KEY: ${{ secrets.YJ64_COUNCIL_API_PUBLISHABLE_KEY }}
          YJ64_COUNCIL_AGENT_ID: yj64-engineering-core
          YJ64_COUNCIL_SUBMIT_PATH: ${{ vars.YJ64_COUNCIL_SUBMIT_PATH || '/api/v1/external-agents/council/requests' }}
          YJ64_COUNCIL_STATUS_PATH: ${{ vars.YJ64_COUNCIL_STATUS_PATH || '/api/v1/external-agents/council/requests/{request_id}' }}
          YJ64_COUNCIL_RESULT_PATH: ${{ vars.YJ64_COUNCIL_RESULT_PATH || '/api/v1/external-agents/council/requests/{request_id}/result' }}
          YJ64_COUNCIL_CANCEL_PATH: ${{ vars.YJ64_COUNCIL_CANCEL_PATH || '/api/v1/external-agents/council/requests/{request_id}/cancel' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YJ64_WORKER_SLOT: ${{ matrix.slot }}
        run: python scripts/run_council_gateway_worker.py
