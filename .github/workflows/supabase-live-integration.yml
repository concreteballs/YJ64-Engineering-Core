name: Supabase live integration check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-live-integration
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YJ64_DATABASE_URL: ${{ secrets.YJ64_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YJ64 package
        run: python -m pip install -e .
      - name: Verify live PostgreSQL and private Storage
        run: python scripts/verify_supabase_integration.py
