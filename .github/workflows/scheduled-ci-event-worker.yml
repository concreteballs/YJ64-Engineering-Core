name: Scheduled CI Event Worker

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/scheduled-ci-event-worker.yml"
      - "scripts/run_ci_event_worker.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["CI completion persistence", "Poll Android runtime runs"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  actions: read

# Keep workflow runs serialized; each run fans out into five independently
# leased workers. PostgreSQL SKIP LOCKED prevents duplicate task claims.
concurrency:
  group: yj64-ci-event-worker
  cancel-in-progress: false

jobs:
  process-one:
    name: Process one CI event (worker ${{ matrix.slot }})
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slot: ["1", "2", "3", "4", "5"]
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YJ64 package and PostgreSQL driver
        run: python -m pip install -e .
      - name: Process one persisted CI event and store its logs
        env:
          YJ64_DATABASE_URL: ${{ secrets.YJ64_DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          YJ64_WORKER_SLOT: ${{ matrix.slot }}
        run: python scripts/run_ci_event_worker.py
