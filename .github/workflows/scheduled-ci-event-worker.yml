name: Scheduled CI Event Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["CI completion persistence"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  actions: read

concurrency:
  group: yj64-ci-event-worker
  cancel-in-progress: false

jobs:
  process-one:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YJ64 package and PostgreSQL driver
        run: python -m pip install -e .
      - name: Process one persisted CI event and store its logs
        env:
          YJ64_DATABASE_URL: \${{ secrets.YJ64_DATABASE_URL }}
          GITHUB_TOKEN: \${{ github.token }}
        run: python scripts/run_ci_event_worker.py
