name: Python tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enable Ubuntu Universe repository
        run: sudo add-apt-repository -y universe
      - name: Install CalculiX
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx
      - name: Verify CalculiX executable
        run: |
          command -v ccx
          ccx -v || echo "CalculiX version flag returned a non-zero status"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit and CalculiX integration tests
        run: python -m unittest discover -s tests -v
