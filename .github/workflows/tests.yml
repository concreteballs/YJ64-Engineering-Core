name: Python tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enable Ubuntu Universe repository
        run: sudo add-apt-repository -y universe
      - name: Install engineering solvers and CAD renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx openscad
      - name: Verify external tools
        run: |
          command -v ccx
          command -v openscad
          ccx -v || echo "CalculiX version flag returned a non-zero status"
          openscad --version
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit, FEM and real 3D CAD integration tests
        run: python -m unittest discover -s tests -v
      - name: Generate 12m yacht hull demonstration artifacts
        run: python examples/generate_demo_hull.py
      - name: Upload 2D and 3D yacht hull artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yj64-yacht-hull-demo
          path: build/hull-demo/
          if-no-files-found: error
          retention-days: 14
