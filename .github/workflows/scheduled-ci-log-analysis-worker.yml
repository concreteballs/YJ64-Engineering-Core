name: Scheduled CI Log Analysis Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Python tests"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: yj64-ci-log-analysis
  cancel-in-progress: false

jobs:
  analyze-one:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YJ64 package and PostgreSQL driver
        run: python -m pip install -e .
      - name: Analyze one durable CI log with the free-tier Gemini model
        env:
          YJ64_DATABASE_URL: ${{ secrets.YJ64_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/run_ci_log_analysis_worker.py
