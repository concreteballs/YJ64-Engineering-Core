name: Discover Gemini API models

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-gemini-models.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yj64-gemini-model-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List models available to the configured API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              print("RESULT: GEMINI_API_KEY secret is missing or empty.")
              sys.exit(1)

          base = "https://generativelanguage.googleapis.com/v1beta/models"
          page_token = None
          models = []

          try:
              while True:
                  url = base + "?pageSize=1000"
                  if page_token:
                      from urllib.parse import urlencode
                      url += "&" + urlencode({"pageToken": page_token})
                  request = urllib.request.Request(
                      url,
                      headers={"x-goog-api-key": api_key, "Accept": "application/json"},
                  )
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.loads(response.read().decode("utf-8"))

                  for model in payload.get("models", []):
                      methods = model.get("supportedGenerationMethods", [])
                      if "generateContent" in methods:
                          models.append({
                              "name": model.get("name", ""),
                              "displayName": model.get("displayName", ""),
                              "inputTokenLimit": model.get("inputTokenLimit"),
                              "outputTokenLimit": model.get("outputTokenLimit"),
                              "supportedGenerationMethods": methods,
                          })

                  page_token = payload.get("nextPageToken")
                  if not page_token:
                      break

              models.sort(key=lambda item: item["name"])
              print("RESULT: authenticated model discovery succeeded.")
              print("GENERATE_CONTENT_MODEL_COUNT:", len(models))
              for model in models:
                  print(json.dumps(model, ensure_ascii=False, sort_keys=True))

              target = next(
                  (item for item in models if item["name"] == "models/gemini-3.5-flash"),
                  None,
              )
              print("GEMINI_3_5_FLASH_AVAILABLE:", "yes" if target else "no")
              if target:
                  print("GEMINI_3_5_FLASH_METADATA:", json.dumps(target, ensure_ascii=False, sort_keys=True))

          except urllib.error.HTTPError as exc:
              print("RESULT: Google API rejected model discovery.")
              print("HTTP_STATUS:", exc.code)
              sys.exit(1)
          except Exception as exc:
              print("RESULT: model discovery failed.")
              print("ERROR_TYPE:", type(exc).__name__)
              sys.exit(1)
          PY
