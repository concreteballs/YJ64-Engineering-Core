name: Cross-module contract checks

on:
  push:
    branches: [main]
    paths:
      - "src/yj64_engineering_core/cross_module.py"
      - "src/yj64_engineering_core/extensions.py"
      - "src/yj64_engineering_core/automation/cross_module_tasks.py"
      - "src/yj64_engineering_core/automation/parent_resume.py"
      - "tests/test_parent_resume.py"
      - "migrations/0022_generic_parent_task_resume.sql"
      - "tests/test_cross_module.py"
      - "tests/test_cross_module_tasks.py"
      - "tests/test_extension_packs.py"
      - "tests/fixtures/cross_module/**"
      - "pyproject.toml"
      - ".github/workflows/cross-module-contracts.yml"
  pull_request:
    paths:
      - "src/yj64_engineering_core/cross_module.py"
      - "src/yj64_engineering_core/extensions.py"
      - "src/yj64_engineering_core/automation/cross_module_tasks.py"
      - "tests/test_cross_module.py"
      - "tests/test_cross_module_tasks.py"
      - "tests/test_extension_packs.py"
      - "tests/fixtures/cross_module/**"
      - "pyproject.toml"
      - ".github/workflows/cross-module-contracts.yml"
  workflow_dispatch:

jobs:
  cross-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_cross_module.py" -v
      - run: python -m unittest discover -s tests -p "test_extension_packs.py" -v
      - run: python -m unittest discover -s tests -p "test_cross_module_tasks.py" -v
      - run: python -m unittest discover -s tests -p "test_parent_resume.py" -v
