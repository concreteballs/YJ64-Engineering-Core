name: CI completion persistence

on:
  workflow_run:
    workflows: ["Python tests"]
    types: [completed]

permissions:
  contents: read

jobs:
  persist:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main-branch code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YJ64 package and PostgreSQL driver
        run: python -m pip install -e .
      - name: Persist CI event directly to Supabase PostgreSQL queue
        env:
          YJ64_DATABASE_URL: ${{ secrets.YJ64_DATABASE_URL }}
        run: python scripts/record_ci_completion.py
